<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お酒の達人クイズ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; color: #ffffff; min-height: 100vh; display: flex; align-items: center; }
        .container { max-width: 750px; }
        .card { background: #16213e; border: 2px solid #4ecca3; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: #ffffff !important; }
        #question-name { color: #ffffff; font-weight: 800; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        #question-type { color: #4ecca3; font-weight: bold; }
        .choice-btn { width: 100%; margin-bottom: 15px; font-size: 1.1rem; transition: 0.2s; border: 2px solid #4ecca3; color: white; background: transparent; }
        .choice-btn:hover { background: #4ecca3; color: #1a1a2e; }
        .progress { height: 12px; margin-bottom: 25px; background: #0f3460; }
        .progress-bar { background-color: #4ecca3; }
        .correct-bg { background-color: #28a745 !important; border-color: #28a745 !important; }
        .wrong-bg { background-color: #dc3545 !important; border-color: #dc3545 !important; }
        .review-area { max-height: 400px; overflow-y: auto; background: #0f3460; border-radius: 10px; padding: 20px; }
        .review-item { border-bottom: 1px solid #4ecca3; padding: 12px 0; text-align: left; }
        .mode-select { border: 2px solid #a2a8d3; padding: 15px; border-radius: 10px; margin-bottom: 20px; cursor: pointer; transition: 0.3s; }
        .mode-select.active { border-color: #4ecca3; background: #1f4068; }
        .d-none { display: none !important; }
    </style>
</head>
<body>

<div class="container text-center">
    <!-- ホーム画面 -->
    <div id="home-screen" class="card">
        <h1 class="display-5 mb-4" style="color: #4ecca3; font-weight: bold;">Liquor Master Quiz</h1>
        
        <p class="text-white-50">1. クイズモードを選択</p>
        <div class="row mb-4">
            <div class="col-6">
                <div id="mode-cocktail" class="mode-select active" onclick="setMode('cocktail')">
                    <h5>🍸 カクテル構成</h5>
                    <small>ベースや割り材を当てる</small>
                </div>
            </div>
            <div class="col-6">
                <div id="mode-brand" class="mode-select" onclick="setMode('brand')">
                    <h5>🍾 お酒の種類</h5>
                    <small>銘柄から種類を当てる</small>
                </div>
            </div>
        </div>

        <p class="text-white-50">2. 問題数を選択</p>
        <div class="d-grid gap-2 col-8 mx-auto">
            <div class="btn-group">
                <button class="btn btn-outline-info text-white" onclick="startGame(10)">10問</button>
                <button class="btn btn-outline-info text-white" onclick="startGame(20)">20問</button>
                <button class="btn btn-outline-info text-white" onclick="startGame(30)">30問</button>
                <button class="btn btn-outline-info text-white" onclick="startGame(40)">40問</button>
                <button class="btn btn-outline-info text-white" onclick="startGame(50)">50問</button>
            </div>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="card d-none">
        <div class="progress">
            <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <p id="question-count" class="small mb-2 text-white-50"></p>
        <h4 id="question-type" class="mb-3">---</h4>
        <h2 id="question-name" class="display-4 mb-4">---</h2>
        <div id="choices" class="row"></div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="card d-none">
        <h2 class="mb-3">結果発表</h2>
        <h1 id="score-text" class="display-3 mb-4" style="color: #4ecca3; font-weight: bold;"></h1>
        <div id="review-area" class="review-area mb-4"></div>
        <button class="btn btn-primary btn-lg px-5" onclick="location.reload()">ホームに戻る</button>
    </div>
</div>

<script>
// --- データセット ---
const cocktailData = [
    { name: "ジントニック", base: "ジン", mixer: "トニックウォーター" },
    { name: "モスコミュール", base: "ウォッカ", mixer: "ジンジャーエール" },
    { name: "マルガリータ", base: "テキーラ", mixer: "ホワイトキュラソー" },
    { name: "ダイキリ", base: "ラム", mixer: "ライムジュース" },
    { name: "マティーニ", base: "ジン", mixer: "ドライベルモット" },
    { name: "カシスオレンジ", base: "カシスリキュール", mixer: "オレンジジュース" },
    { name: "スクリュードライバー", base: "ウォッカ", mixer: "オレンジジュース" },
    { name: "モヒート", base: "ラム", mixer: "ソーダ" },
    { name: "テキーラサンライズ", base: "テキーラ", mixer: "オレンジジュース" },
    { name: "カルーアミルク", base: "コーヒーリキュール", mixer: "ミルク" },
    { name: "ジンバック", base: "ジン", mixer: "ジンジャーエール" },
    { name: "サイドカー", base: "ブランデー", mixer: "ホワイトキュラソー" },
    { name: "キール", base: "白ワイン", mixer: "カシスリキュール" },
    { name: "シャンディガフ", base: "ビール", mixer: "ジンジャーエール" },
    { name: "スプモーニ", base: "カンパリ", mixer: "グレープフルーツジュース" },
    { name: "ネグローニ", base: "ジン", mixer: "カンパリ" },
    { name: "バラライカ", base: "ウォッカ", mixer: "ホワイトキュラソー" },
    { name: "ホワイトレディ", base: "ジン", mixer: "ホワイトキュラソー" },
    { name: "キューバリブレ", base: "ラム", mixer: "コーラ" },
    { name: "ソルティドッグ", base: "ウォッカ", mixer: "グレープフルーツジュース" },
    { name: "カミカゼ", base: "ウォッカ", mixer: "ホワイトキュラソー" },
    { name: "ブルドッグ", base: "ウォッカ", mixer: "グレープフルーツジュース" },
    { name: "ギムレット", base: "ジン", mixer: "ライムジュース" },
    { name: "レゲエパンチ", base: "ピーチリキュール", mixer: "ウーロン茶" },
    { name: "ファジーネーブル", base: "ピーチリキュール", mixer: "オレンジジュース" },
    { name: "ブラッディメアリー", base: "ウォッカ", mixer: "トマトジュース" },
    { name: "マンハッタン", base: "ウイスキー", mixer: "スイートベルモット" },
    { name: "アレキサンダー", base: "ブランデー", mixer: "カカオリキュール" },
    { name: "チャイナブルー", base: "ライチリキュール", mixer: "グレープフルーツジュース" },
    { name: "レッドアイ", base: "ビール", mixer: "トマトジュース" },
    { name: "ハイボール", base: "ウイスキー", mixer: "ソーダ" },
    { name: "ゴッドファーザー", base: "ウイスキー", mixer: "アマレット" },
    { name: "ボストンクーラー", base: "ラム", mixer: "ジンジャーエール" },
    { name: "マイタイ", base: "ラム", mixer: "オレンジジュース" },
    { name: "オペレーター", base: "白ワイン", mixer: "ジンジャーエール" },
    { name: "キティ", base: "赤ワイン", mixer: "ジンジャーエール" },
    { name: "ブラックルシアン", base: "ウォッカ", mixer: "コーヒーリキュール" },
    { name: "エックス・ワイ・ジー", base: "ラム", mixer: "ホワイトキュラソー" },
    { name: "フレンチコネクション", base: "ブランデー", mixer: "アマレット" },
    { name: "ジンリッキー", base: "ジン", mixer: "ソーダ" },
    { name: "オレンジブロッサム", base: "ジン", mixer: "オレンジジュース" },
    { name: "パローマ", base: "テキーラ", mixer: "グレープフルーツジュース" },
    { name: "アンバサダー", base: "テキーラ", mixer: "オレンジジュース" },
    { name: "カシスソーダ", base: "カシスリキュール", mixer: "ソーダ" },
    { name: "カシスウーロン", base: "カシスリキュール", mixer: "ウーロン茶" },
    { name: "カンパリオレンジ", base: "カンパリ", mixer: "オレンジジュース" },
    { name: "シンガポールスリング", base: "ジン", mixer: "チェリーブランデー" },
    { name: "マタドール", base: "テキーラ", mixer: "パイナップルジュース" },
    { name: "メキシコーラ", base: "テキーラ", mixer: "コーラ" },
    { name: "ピニャコラーダ", base: "ラム", mixer: "パイナップルジュース" }
];

const brandData = [
    { name: "タンカレー", type: "ジン" }, { name: "ボンベイ・サファイア", type: "ジン" }, { name: "ビーフィーター", type: "ジン" },
    { name: "スミノフ", type: "ウォッカ" }, { name: "アブソルート", type: "ウォッカ" }, { name: "グレイグース", type: "ウォッカ" },
    { name: "バカルディ", type: "ラム" }, { name: "キャプテン・モルガン", type: "ラム" }, { name: "マイヤーズ", type: "ラム" },
    { name: "クエルボ", type: "テキーラ" }, { name: "サウザ", type: "テキーラ" }, { name: "パトロン", type: "テキーラ" },
    { name: "山崎", type: "ウイスキー" }, { name: "ジャックダニエル", type: "ウイスキー" }, { name: "マッカラン", type: "ウイスキー" },
    { name: "ヘネシー", type: "ブランデー" }, { name: "レミーマルタン", type: "ブランデー" }, { name: "マーテル", type: "ブランデー" },
    { name: "いいちこ", type: "焼酎" }, { name: "黒霧島", type: "焼酎" }, { name: "魔王", type: "焼酎" },
    { name: "獺祭", type: "日本酒" }, { name: "久保田", type: "日本酒" }, { name: "八海山", type: "日本酒" },
    { name: "カンパリ", type: "リキュール" }, { name: "カシス", type: "リキュール" }, { name: "カルーア", type: "リキュール" },
    { name: "コカレロ", type: "リキュール" }, { name: "イエガーマイスター", type: "リキュール" }, { name: "チンザノ", type: "ワイン(ベルモット)" },
    { name: "モエ・エ・シャンドン", type: "シャンパン" }, { name: "ドン・ペリニヨン", type: "シャンパン" }, { name: "ヴーヴ・クリコ", type: "シャンパン" },
    { name: "コロナ", type: "ビール" }, { name: "ハイネケン", type: "ビール" }, { name: "ギネス", type: "ビール" },
    { name: "ジムビーム", type: "ウイスキー" }, { name: "シーバスリーガル", type: "ウイスキー" }, { name: "ボウモア", type: "ウイスキー" },
    { name: "ズブロッカ", type: "ウォッカ" }, { name: "ハバナクラブ", type: "ラム" }, { name: "ロンリコ", type: "ラム" },
    { name: "オールドパー", type: "ウイスキー" }, { name: "ワイルドターキー", type: "ウイスキー" }, { name: "ラフロイグ", type: "ウイスキー" },
    { name: "一刻者", type: "焼酎" }, { name: "赤霧島", type: "焼酎" }, { name: "中々", type: "焼酎" },
    { name: "十四代", type: "日本酒" }, { name: "越乃寒梅", type: "日本酒" }
];

const categories = ["ジン", "ウォッカ", "テキーラ", "ラム", "ウイスキー", "ブランデー", "リキュール", "焼酎", "日本酒", "ビール", "シャンパン"];
const mixers = ["トニックウォーター", "ジンジャーエール", "オレンジジュース", "グレープフルーツジュース", "コーラ", "ソーダ", "トマトジュース", "ミルク", "ウーロン茶", "パイナップルジュース", "ライムジュース", "ホワイトキュラソー", "ベルモット"];

let currentMode = 'cocktail';
let activeQuizList = [];
let currentIdx = 0;
let score = 0;
let logs = [];

function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-select').forEach(el => el.classList.remove('active'));
    document.getElementById(`mode-${mode}`).classList.add('active');
}

function startGame(num) {
    const data = (currentMode === 'cocktail') ? cocktailData : brandData;
    activeQuizList = [...data].sort(() => Math.random() - 0.5).slice(0, num);
    currentIdx = 0; score = 0; logs = [];
    document.getElementById("home-screen").classList.add("d-none");
    document.getElementById("quiz-screen").classList.remove("d-none");
    loadQuestion();
}

function loadQuestion() {
    const item = activeQuizList[currentIdx];
    let qType, qName, correct, pool;

    if (currentMode === 'cocktail') {
        const isBase = Math.random() > 0.5;
        qType = isBase ? "【ベース】を当てろ！" : "【割り材】を当てろ！";
        qName = item.name;
        correct = isBase ? item.base : item.mixer;
        pool = isBase ? categories : mixers;
    } else {
        qType = "この銘柄の【種類】は何？";
        qName = item.name;
        correct = item.type;
        pool = categories;
    }

    document.getElementById("question-type").textContent = qType;
    document.getElementById("question-name").textContent = qName;
    document.getElementById("question-count").textContent = `Q ${currentIdx + 1} / ${activeQuizList.length}`;
    document.getElementById("progress-bar").style.width = (currentIdx / activeQuizList.length * 100) + "%";

    let choices = [correct];
    while(choices.length < 4) {
        let r = pool[Math.floor(Math.random() * pool.length)];
        if(!choices.includes(r)) choices.push(r);
    }
    choices.sort(() => Math.random() - 0.5);

    const container = document.getElementById("choices");
    container.innerHTML = "";
    choices.forEach(c => {
        const col = document.createElement("div");
        col.className = "col-6";
        col.innerHTML = `<button class="btn choice-btn" onclick="checkAnswer(this, '${c}', '${correct}')">${c}</button>`;
        container.appendChild(col);
    });
}

function checkAnswer(btn, selected, correct) {
    document.querySelectorAll(".choice-btn").forEach(b => b.disabled = true);
    const isCorrect = (selected === correct);
    if(isCorrect) { score++; btn.classList.add("correct-bg"); }
    else { btn.classList.add("wrong-bg"); }

    logs.push({ name: activeQuizList[currentIdx].name, selected, correct, isCorrect });

    setTimeout(() => {
        currentIdx++;
        if(currentIdx < activeQuizList.length) loadQuestion();
        else showResult();
    }, 600);
}

function showResult() {
    document.getElementById("quiz-screen").classList.add("d-none");
    document.getElementById("result-screen").classList.remove("d-none");
    document.getElementById("score-text").textContent = `${score} / ${activeQuizList.length}`;
    
    const area = document.getElementById("review-area");
    area.innerHTML = "";
    logs.forEach(log => {
        const div = document.createElement("div");
        div.className = "review-item";
        div.innerHTML = `<strong>${log.isCorrect ? '✅' : '❌'} ${log.name}</strong><br>
            <small>回答: <span class="${log.isCorrect ? 'text-success' : 'text-danger'}">${log.selected}</span> | 正解: ${log.correct}</small>`;
        area.appendChild(div);
    });
}
</script>
</body>
</html>
